openapi: 3.1.0
info:
  title: FocusBoard API
  version: 0.4.0
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check HTTP server liveness
      responses:
        "200":
          description: HTTP server is running independently of PostgreSQL availability.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    const: ok
  /ready:
    get:
      operationId: getReadiness
      summary: Check PostgreSQL readiness
      description: Internal operation. The public reverse proxy must block this path.
      responses:
        "200":
          description: The application can reach PostgreSQL.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    const: ready
        "503":
          description: The PostgreSQL check failed or exceeded its time limit.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: object
                    required: [code, message]
                    properties:
                      code:
                        const: SERVICE_UNAVAILABLE
                      message:
                        type: string
                        examples: ["Service temporarily unavailable."]
  /auth/register:
    post:
      operationId: register
      summary: Create an account and a refresh session
      parameters:
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Register"
      responses:
        "201":
          $ref: "#/components/responses/Registered"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "403":
          $ref: "#/components/responses/ForbiddenOrigin"
        "409":
          $ref: "#/components/responses/DuplicateEmail"
        "422":
          $ref: "#/components/responses/InvalidFields"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/ServerError"
  /auth/login:
    post:
      operationId: login
      summary: Verify credentials and create a refresh session
      parameters:
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Login"
      responses:
        "200":
          $ref: "#/components/responses/Authenticated"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "403":
          $ref: "#/components/responses/ForbiddenOrigin"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/ServerError"
  /auth/refresh:
    post:
      operationId: refresh
      summary: Rotate the refresh cookie and issue an access JWT
      description: Send an empty body. Rotation preserves the original session expiry.
      security:
        - refreshCookie: []
      parameters:
        - $ref: "#/components/parameters/Origin"
      responses:
        "200":
          $ref: "#/components/responses/Authenticated"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "401":
          $ref: "#/components/responses/InvalidSession"
        "403":
          $ref: "#/components/responses/ForbiddenOrigin"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/ServerError"
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the supplied refresh session and clear the cookie
      description: Send an empty body. Repeating the request is safe.
      security:
        - refreshCookie: []
        - {}
      parameters:
        - $ref: "#/components/parameters/Origin"
      responses:
        "204":
          $ref: "#/components/responses/SessionCleared"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "403":
          $ref: "#/components/responses/ForbiddenOrigin"
        default:
          $ref: "#/components/responses/ServerError"
  /users/me:
    get:
      operationId: getProfile
      summary: Read the authenticated user's profile
      security:
        - bearer: []
      responses:
        "200":
          $ref: "#/components/responses/Profile"
        "401":
          $ref: "#/components/responses/InvalidBearer"
        default:
          $ref: "#/components/responses/ServerError"
    patch:
      operationId: renameProfile
      summary: Update the authenticated user's name
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name:
                  $ref: "#/components/schemas/Name"
      responses:
        "200":
          $ref: "#/components/responses/Profile"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "401":
          $ref: "#/components/responses/InvalidBearer"
        "422":
          $ref: "#/components/responses/InvalidFields"
        default:
          $ref: "#/components/responses/ServerError"
  /users/me/password:
    put:
      operationId: changePassword
      summary: Change the password and revoke all refresh sessions
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  $ref: "#/components/schemas/ExistingPassword"
                newPassword:
                  $ref: "#/components/schemas/NewPassword"
      responses:
        "204":
          $ref: "#/components/responses/SessionCleared"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "401":
          description: Invalid bearer token or current password.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            WWW-Authenticate:
              description: Bearer challenge when authentication is missing or invalid.
              schema:
                const: Bearer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                currentPassword:
                  value:
                    error:
                      code: INVALID_CREDENTIALS
                      message: Invalid current password.
        "403":
          $ref: "#/components/responses/ForbiddenOrigin"
        "422":
          $ref: "#/components/responses/InvalidFields"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/ServerError"
  /tasks:
    get:
      operationId: getBoard
      summary: Read the active board in column and position order
      security:
        - bearer: []
      responses:
        "200":
          $ref: "#/components/responses/TaskBoard"
        "401":
          $ref: "#/components/responses/InvalidBearer"
        default:
          $ref: "#/components/responses/ServerError"
    post:
      operationId: createTask
      summary: Create a task at the end of a column
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTask"
      responses:
        "201":
          $ref: "#/components/responses/Task"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "401":
          $ref: "#/components/responses/InvalidBearer"
        "409":
          $ref: "#/components/responses/OrderConflict"
        "422":
          $ref: "#/components/responses/InvalidFields"
        default:
          $ref: "#/components/responses/ServerError"
  /tasks/{id}:
    parameters:
      - $ref: "#/components/parameters/TaskID"
    get:
      operationId: getTask
      summary: Read an active task owned by the caller
      security:
        - bearer: []
      responses:
        "200":
          $ref: "#/components/responses/Task"
        "401":
          $ref: "#/components/responses/InvalidBearer"
        "404":
          $ref: "#/components/responses/TaskNotFound"
        "422":
          $ref: "#/components/responses/InvalidFields"
        default:
          $ref: "#/components/responses/ServerError"
    patch:
      operationId: updateTask
      summary: Update task fields and append to the new column on status change
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTask"
      responses:
        "200":
          $ref: "#/components/responses/Task"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "401":
          $ref: "#/components/responses/InvalidBearer"
        "404":
          $ref: "#/components/responses/TaskNotFound"
        "409":
          $ref: "#/components/responses/OrderConflict"
        "422":
          $ref: "#/components/responses/InvalidFields"
        default:
          $ref: "#/components/responses/ServerError"
    delete:
      operationId: deleteTask
      summary: Soft delete a task and compact its column
      security:
        - bearer: []
      responses:
        "204":
          $ref: "#/components/responses/TaskDeleted"
        "401":
          $ref: "#/components/responses/InvalidBearer"
        "404":
          $ref: "#/components/responses/TaskNotFound"
        "409":
          $ref: "#/components/responses/OrderConflict"
        "422":
          $ref: "#/components/responses/InvalidFields"
        default:
          $ref: "#/components/responses/ServerError"
  /tasks/{id}/move:
    parameters:
      - $ref: "#/components/parameters/TaskID"
    patch:
      operationId: moveTask
      summary: Move a task and return the committed board
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveTask"
      responses:
        "200":
          $ref: "#/components/responses/TaskBoard"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "401":
          $ref: "#/components/responses/InvalidBearer"
        "404":
          $ref: "#/components/responses/TaskNotFound"
        "409":
          $ref: "#/components/responses/OrderConflict"
        "422":
          $ref: "#/components/responses/InvalidFields"
        default:
          $ref: "#/components/responses/ServerError"
  /statistics:
    get:
      operationId: getStatistics
      summary: Count tasks by their first historical Done
      description: >
        Computes the first Done across the caller's entire task history, including
        soft-deleted and reopened tasks. All counts use one database snapshot
        and exclude events after the calculation time.
      security:
        - bearer: []
      parameters:
        - name: period
          in: query
          description: >
            Days contains the 7 days of the current Monday–Sunday week.
            Weeks contains the current Monday-based week and the 7 previous weeks.
            Omit to use days. Empty or repeated parameters are rejected.
          schema:
            type: string
            enum: [days, weeks]
            default: days
        - name: timezone
          in: query
          description: >
            IANA timezone name, such as Europe/Moscow or Asia/Kolkata.
            Omit to use UTC. Empty values, repeated parameters, filesystem paths,
            and system-local aliases are rejected. Only these two query parameters are supported.
          schema:
            type: string
            default: UTC
          example: Europe/Moscow
      responses:
        "200":
          $ref: "#/components/responses/Statistics"
        "401":
          $ref: "#/components/responses/InvalidBearer"
        "422":
          $ref: "#/components/responses/InvalidFields"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          description: The statistics request exceeded its deadline.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: SERVICE_UNAVAILABLE
                  message: Service temporarily unavailable.
components:
  headers:
    CacheControl:
      schema:
        type: string
        const: no-store
    RequestID:
      description: Identifier generated by the HTTP server.
      schema:
        type: string
    RefreshCookie:
      description: Host-only HttpOnly cookie with Path=/api/v1/auth, SameSite=Lax and Secure on HTTPS. Max-Age tracks the remaining absolute session lifetime.
      schema:
        type: string
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: focusboard_refresh
      description: Default cookie name. Deployments can override REFRESH_COOKIE_NAME.
  parameters:
    TaskID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Origin:
      name: Origin
      in: header
      required: true
      description: Must exactly match APP_ORIGIN, including for CLI clients.
      schema:
        type: string
        format: uri
  schemas:
    User:
      type: object
      additionalProperties: false
      required: [id, name, email, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          $ref: "#/components/schemas/Name"
        email:
          type: string
          format: email
          maxLength: 254
        createdAt:
          type: string
          format: date-time
    Name:
      type: string
      description: Must contain 1–80 characters after trimming surrounding whitespace.
    EmailInput:
      type: string
      description: ASCII email address up to 254 characters after trimming surrounding whitespace and lowercasing. Use punycode for internationalized domains.
    ExistingPassword:
      type: string
      format: password
      minLength: 1
      maxLength: 128
      description: Limited to 512 UTF-8 bytes and used exactly as submitted.
    NewPassword:
      type: string
      format: password
      minLength: 12
      maxLength: 128
      description: Limited to 512 UTF-8 bytes and used exactly as submitted.
    Register:
      type: object
      additionalProperties: false
      required: [name, email, password]
      properties:
        name:
          $ref: "#/components/schemas/Name"
        email:
          $ref: "#/components/schemas/EmailInput"
        password:
          $ref: "#/components/schemas/NewPassword"
    Login:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          $ref: "#/components/schemas/EmailInput"
        password:
          $ref: "#/components/schemas/ExistingPassword"
    Authenticated:
      type: object
      additionalProperties: false
      required: [accessToken, expiresIn, user]
      properties:
        accessToken:
          type: string
          description: HS256 access JWT with sub, iss, aud, exp, iat and jti.
        expiresIn:
          type: integer
          description: Access token lifetime in seconds.
          minimum: 1
          maximum: 900
        user:
          $ref: "#/components/schemas/User"
    TaskStatus:
      type: string
      enum: [not_started, in_progress, finish, done]
    TaskTitle:
      type: string
      description: 1–120 Unicode characters after trimming surrounding whitespace. NUL is rejected.
    TaskDescription:
      type: string
      maxLength: 2000
      description: NUL is rejected.
    TaskDate:
      type: [string, "null"]
      format: date
      description: Calendar date in YYYY-MM-DD with year 0001–9999. Past dates are allowed.
    TaskPosition:
      type: integer
      minimum: 0
      maximum: 2147483647
    Task:
      type: object
      additionalProperties: false
      required: [id, title, description, status, position, dueDate, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          $ref: "#/components/schemas/TaskTitle"
        description:
          $ref: "#/components/schemas/TaskDescription"
        status:
          $ref: "#/components/schemas/TaskStatus"
        position:
          $ref: "#/components/schemas/TaskPosition"
        dueDate:
          $ref: "#/components/schemas/TaskDate"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateTask:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          $ref: "#/components/schemas/TaskTitle"
        description:
          $ref: "#/components/schemas/TaskDescription"
          default: ""
        status:
          $ref: "#/components/schemas/TaskStatus"
          default: not_started
        dueDate:
          $ref: "#/components/schemas/TaskDate"
          default: null
    UpdateTask:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Omitted fields are preserved. An explicit null clears dueDate.
      properties:
        title:
          $ref: "#/components/schemas/TaskTitle"
        description:
          $ref: "#/components/schemas/TaskDescription"
        status:
          $ref: "#/components/schemas/TaskStatus"
        dueDate:
          $ref: "#/components/schemas/TaskDate"
    MoveTask:
      type: object
      additionalProperties: false
      required: [status, position]
      properties:
        status:
          $ref: "#/components/schemas/TaskStatus"
        position:
          $ref: "#/components/schemas/TaskPosition"
          description: Zero-based insertion index after removing the moving task from its original column. The current destination length is the maximum.
    TaskBoard:
      type: object
      additionalProperties: false
      required: [tasks]
      properties:
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/Task"
    StatisticsBucket:
      type: object
      additionalProperties: false
      required: [startDate, count]
      properties:
        startDate:
          type: string
          format: date
          description: Local calendar date, or the local Monday for a weekly bucket.
        count:
          type: integer
          format: int64
          minimum: 0
          description: Number of tasks whose first Done occurred in this bucket.
    StatisticsResponse:
      type: object
      additionalProperties: false
      required: [period, timezone, buckets, thisWeek, thisMonth]
      properties:
        period:
          type: string
          enum: [days, weeks]
        timezone:
          type: string
          description: IANA timezone used for the report.
        buckets:
          type: array
          description: Chronologically sorted buckets, including zero counts.
          items:
            $ref: "#/components/schemas/StatisticsBucket"
        thisWeek:
          type: integer
          format: int64
          minimum: 0
          description: First closures in the current local Monday-based week.
        thisMonth:
          type: integer
          format: int64
          minimum: 0
          description: First closures in the current local calendar month.
      oneOf:
        - properties:
            period:
              const: days
            buckets:
              minItems: 7
              maxItems: 7
        - properties:
            period:
              const: weeks
            buckets:
              minItems: 8
              maxItems: 8
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            fields:
              type: object
              additionalProperties:
                type: string
  responses:
    Statistics:
      description: Historical first closures and local calendar totals for the authenticated user.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/StatisticsResponse"
          examples:
            days:
              value:
                period: days
                timezone: Europe/Moscow
                buckets:
                  - {startDate: "2026-11-23", count: 1}
                  - {startDate: "2026-11-24", count: 2}
                  - {startDate: "2026-11-25", count: 0}
                  - {startDate: "2026-11-26", count: 0}
                  - {startDate: "2026-11-27", count: 0}
                  - {startDate: "2026-11-28", count: 0}
                  - {startDate: "2026-11-29", count: 0}
                thisWeek: 3
                thisMonth: 12
            weeks:
              value:
                period: weeks
                timezone: Europe/Moscow
                buckets:
                  - {startDate: "2026-10-05", count: 1}
                  - {startDate: "2026-10-12", count: 0}
                  - {startDate: "2026-10-19", count: 1}
                  - {startDate: "2026-10-26", count: 0}
                  - {startDate: "2026-11-02", count: 5}
                  - {startDate: "2026-11-09", count: 4}
                  - {startDate: "2026-11-16", count: 0}
                  - {startDate: "2026-11-23", count: 3}
                thisWeek: 3
                thisMonth: 12
    Task:
      description: Public task representation.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Task"
    TaskBoard:
      description: Active tasks in fixed column order and ascending position. An empty board contains an empty tasks array.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TaskBoard"
    TaskDeleted:
      description: Task soft deleted. The response has no body.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
    TaskNotFound:
      description: The task is missing, deleted, or owned by another account.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: TASK_NOT_FOUND
              message: Task not found.
    OrderConflict:
      description: The database rejected conflicting positions or the API detected a gap in a checked column. Reload the board before retrying.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: ORDER_CONFLICT
              message: Task order changed. Reload the board and try again.
    Registered:
      description: Account created and signed in.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Set-Cookie:
          $ref: "#/components/headers/RefreshCookie"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Authenticated"
    Authenticated:
      description: Authentication succeeded.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Set-Cookie:
          $ref: "#/components/headers/RefreshCookie"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Authenticated"
    Profile:
      description: Public profile of the current user.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/User"
    SessionCleared:
      description: Operation succeeded and the refresh cookie was cleared.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Set-Cookie:
          description: Expired refresh cookie with matching scope and Max-Age=0.
          schema:
            type: string
    InvalidJSON:
      description: Malformed or oversized JSON, unknown members, or an unexpected request body.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: VALIDATION_ERROR
              message: Expected a single valid JSON object.
    InvalidFields:
      description: Field validation failed.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: VALIDATION_ERROR
              message: Please check the entered data.
    InvalidCredentials:
      description: Email and password do not authenticate the user.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: INVALID_CREDENTIALS
              message: Invalid email or password.
    InvalidSession:
      description: Missing, expired, revoked or invalid refresh cookie.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: UNAUTHORIZED
              message: Authentication required.
    InvalidBearer:
      description: Missing or invalid access JWT.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        WWW-Authenticate:
          schema:
            const: Bearer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: UNAUTHORIZED
              message: Authentication required.
    ForbiddenOrigin:
      description: Missing or unapproved Origin.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: FORBIDDEN
              message: Origin is not allowed.
    DuplicateEmail:
      description: The normalized email already exists.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: EMAIL_ALREADY_EXISTS
              message: An account with this email already exists.
    RateLimited:
      description: Rate or password worker limit reached.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Retry-After:
          description: Seconds to wait before trying again.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: RATE_LIMITED
              message: Too many requests. Try again later.
    ServerError:
      description: Internal error (500) or operation deadline (503).
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: INTERNAL_ERROR
              message: Something went wrong.
