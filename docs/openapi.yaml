openapi: 3.1.0
info:
  title: FocusBoard API
  version: 0.1.0
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check HTTP server liveness
      responses:
        "200":
          description: HTTP server is running independently of PostgreSQL availability.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    const: ok
  /ready:
    get:
      operationId: getReadiness
      summary: Check PostgreSQL readiness
      description: Internal operation. The public reverse proxy must block this path.
      responses:
        "200":
          description: The application can reach PostgreSQL.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    const: ready
        "503":
          description: The PostgreSQL check failed or exceeded its time limit.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: object
                    required: [code, message]
                    properties:
                      code:
                        const: SERVICE_UNAVAILABLE
                      message:
                        type: string
                        examples: ["Service temporarily unavailable."]
components:
  headers:
    CacheControl:
      schema:
        type: string
        const: no-store
    RequestID:
      description: Identifier generated by the HTTP server.
      schema:
        type: string
